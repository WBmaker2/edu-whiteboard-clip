name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (for QA duration checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Start dev server
        run: |
          npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "dev server failed to start"
          cat /tmp/vite.log
          exit 1
      - name: Full browser QA
        run: npm run qa:ci
      - name: QA bundle budget
        run: npm run qa:bundle
