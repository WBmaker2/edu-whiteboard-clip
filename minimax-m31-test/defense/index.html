<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D 타워 디펜스 — three.js</title>
    <style>
      :root {
        --bg: #060d14;
        --panel: rgba(9, 21, 31, 0.86);
        --panel-solid: #0d2130;
        --line: rgba(94, 168, 190, 0.22);
        --ink: #dceef4;
        --ink-soft: #7fa3b2;
        --accent: #35d6c0;
        --amber: #ffb648;
        --danger: #ff6b5c;
        --radius: 16px;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      .panel {
        position: fixed;
        z-index: 2;
        background: var(--panel);
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .panel-title {
        top: 20px;
        left: 20px;
        padding: 14px 20px;
        max-width: 300px;
      }

      .panel-title h1 {
        margin: 0 0 4px;
        font-size: 18px;
        color: var(--accent);
        letter-spacing: -0.01em;
      }

      .panel-title p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      .panel-stats {
        top: 20px;
        right: 20px;
        padding: 13px 16px;
        min-width: 190px;
      }

      .panel-stats dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 14px;
        font-size: 13px;
      }

      .panel-stats dt {
        color: var(--ink-soft);
      }

      .panel-stats dd {
        margin: 0;
        text-align: right;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .panel-towers {
        left: 20px;
        bottom: 20px;
        padding: 13px 15px;
      }

      .panel-towers h2 {
        margin: 0 0 9px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--ink-soft);
        font-weight: 600;
      }

      .tower-row {
        display: flex;
        gap: 7px;
      }

      .tower-button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-width: 86px;
        padding: 8px 11px;
        text-align: left;
      }

      .tower-button .name {
        font-size: 13.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tower-button .cost {
        font-size: 11.5px;
        color: var(--ink-soft);
      }

      .swatch {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      .panel-bar {
        right: 20px;
        bottom: 20px;
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 460px;
      }

      button {
        font: inherit;
        font-size: 13.5px;
        color: var(--ink);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(94, 200, 190, 0.55);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      .btn-primary {
        background: var(--accent);
        border-color: #159c8c;
        color: #04231f;
        font-weight: 700;
      }

      .btn-pulse {
        animation: btn-pulse 1.9s ease-in-out infinite;
      }

      @keyframes btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(53, 214, 192, 0.45);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(53, 214, 192, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-pulse {
          animation: none;
        }
      }

      .panel-info {
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        padding: 11px 16px;
        font-size: 13px;
        display: none;
        align-items: center;
        gap: 12px;
      }

      .panel-info.show {
        display: flex;
      }

      .panel-info strong {
        color: var(--accent);
      }

      .toast {
        position: fixed;
        left: 50%;
        top: 84px;
        transform: translateX(-50%);
        z-index: 3;
        padding: 9px 16px;
        font-size: 13px;
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 11px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
      }

      .toast.bad {
        border-color: rgba(255, 107, 92, 0.6);
        color: #ffb0a5;
      }

      .hint {
        position: fixed;
        right: 20px;
        top: 132px;
        z-index: 2;
        font-size: 12px;
        color: var(--ink-soft);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 8px 12px;
        max-width: 260px;
        line-height: 1.55;
      }

      .back-link {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font: 500 11px/1 "IBM Plex Mono", "Nanum Gothic Coding", ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--ink-soft);
        background: var(--panel-solid);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 13px;
      }

      .back-link:hover {
        color: var(--accent);
        border-color: rgba(94, 200, 190, 0.5);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a class="back-link" href="../index.html">&#8592; GAMES</a>
    <canvas id="scene"></canvas>

    <section class="panel panel-title">
      <h1>3D 타워 디펜스</h1>
      <p>길에 타워를 세워 적을 막으세요. 타워를 고른 뒤 보드 셀을 누르면 설치됩니다.</p>
    </section>

    <section class="panel panel-stats">
      <dl>
        <dt>골드</dt>
        <dd id="stat-gold">250</dd>
        <dt>생명</dt>
        <dd id="stat-lives">20</dd>
        <dt>웨이브</dt>
        <dd id="stat-wave">0 / 5</dd>
        <dt>적</dt>
        <dd id="stat-enemies">0</dd>
      </dl>
    </section>

    <section class="panel panel-towers">
      <h2>타워</h2>
      <div class="tower-row" id="tower-row"></div>
    </section>

    <nav class="panel panel-bar">
      <button id="btn-wave" class="btn-primary btn-pulse" type="button">다음 웨이브</button>
      <button id="btn-speed" type="button" aria-pressed="false">배속 1×</button>
      <button id="btn-reset" type="button">다시 시작</button>
    </nav>

    <section class="panel panel-info" id="info">
      <span id="info-text"></span>
      <button id="btn-sell" type="button">판매</button>
    </section>

    <p class="hint">드래그: 시점 회전 · 휠: 확대<br />타워 클릭: 선택 · 셀 클릭: 설치</p>
    <div class="toast" id="toast"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
